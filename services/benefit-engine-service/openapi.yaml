openapi: 3.0.3
info:
  title: elipsLife Benefit Engine Service API
  version: 0.1.0
  description: >
    Tenant-scoped KTG Taggeld calculation API for immutable calculation versions, salary freeze,
    coordination windows, entitlement periods, payment instructions, and Taggelddispositiv snapshots.
servers:
  - url: https://api.elipslife.ch/benefit-engine-service
security:
  - bearerAuth: []
tags:
  - name: Calculations
  - name: SalarySnapshots
  - name: CoordinationWindows
  - name: EntitlementPeriods
  - name: DayBreakdowns
  - name: Adjustments
  - name: PaymentInstructions
  - name: Taggelddispositive
paths:
  /v1/tenants/{tenantId}/benefit-calculations:
    get:
      tags: [Calculations]
      operationId: listBenefitCalculations
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - in: query
          name: ktgCaseId
          schema:
            type: string
            format: uuid
        - in: query
          name: calculationStatus
          schema:
            $ref: '#/components/schemas/CalculationStatus'
      responses:
        '200':
          description: Calculation list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BenefitCaseCalculation'
    post:
      tags: [Calculations]
      operationId: createBenefitCalculation
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBenefitCalculationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitCaseCalculation'
  /v1/tenants/{tenantId}/benefit-calculations/{calculationId}:
    get:
      tags: [Calculations]
      operationId: getBenefitCalculation
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CalculationId'
      responses:
        '200':
          description: Calculation detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitCaseCalculationDetail'
  /v1/tenants/{tenantId}/benefit-calculations/{calculationId}/insured-salary-snapshot:
    post:
      tags: [SalarySnapshots]
      operationId: createInsuredSalarySnapshot
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CalculationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInsuredSalarySnapshotRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsuredSalarySnapshot'
  /v1/tenants/{tenantId}/benefit-calculations/{calculationId}/coordination-windows:
    post:
      tags: [CoordinationWindows]
      operationId: createCoordinationWindow
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CalculationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCoordinationWindowRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoordinationWindow'
  /v1/tenants/{tenantId}/benefit-calculations/{calculationId}/entitlement-periods:
    post:
      tags: [EntitlementPeriods]
      operationId: createEntitlementPeriod
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CalculationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBenefitEntitlementPeriodRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitEntitlementPeriod'
  /v1/tenants/{tenantId}/benefit-entitlement-periods/{periodId}/day-breakdowns:
    post:
      tags: [DayBreakdowns]
      operationId: createBenefitDayBreakdown
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PeriodId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBenefitDayBreakdownRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitDayBreakdown'
  /v1/tenants/{tenantId}/benefit-calculations/{calculationId}/adjustments:
    post:
      tags: [Adjustments]
      operationId: createBenefitAdjustment
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CalculationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBenefitAdjustmentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitAdjustment'
  /v1/tenants/{tenantId}/benefit-calculations/{calculationId}/payment-instructions:
    post:
      tags: [PaymentInstructions]
      operationId: createPaymentInstruction
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CalculationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentInstructionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentInstruction'
  /v1/tenants/{tenantId}/payment-instructions/{paymentInstructionId}/taggelddispositive:
    post:
      tags: [Taggelddispositive]
      operationId: createTaggelddispositiv
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PaymentInstructionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaggelddispositivRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaggelddispositivSnapshot'
  /v1/tenants/{tenantId}/benefit-calculations/{calculationId}/approve-for-payment:
    post:
      tags: [Calculations]
      operationId: approveBenefitCalculationForPayment
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CalculationId'
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitCaseCalculation'
  /v1/tenants/{tenantId}/benefit-calculations/{calculationId}/supersede:
    post:
      tags: [Calculations]
      operationId: supersedeBenefitCalculation
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CalculationId'
      responses:
        '200':
          description: Superseded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitCaseCalculation'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      in: path
      name: tenantId
      required: true
      schema:
        type: string
        format: uuid
    CalculationId:
      in: path
      name: calculationId
      required: true
      schema:
        type: string
        format: uuid
    PeriodId:
      in: path
      name: periodId
      required: true
      schema:
        type: string
        format: uuid
    PaymentInstructionId:
      in: path
      name: paymentInstructionId
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CalculationStatus:
      type: string
      enum: [draft, calculated, superseded, approved_for_payment]
    CalculationReason:
      type: string
      enum: [initial, salary_change, incapacity_change, relapse_extension, manual_correction]
    WindowType:
      type: string
      enum: [lohnfortzahlung, wartezeit_overlap, non_payable_coordination]
    PeriodType:
      type: string
      enum: [wartezeit, coordination_non_payable, payable, exhausted, excluded]
    AdjustmentOrigin:
      type: string
      enum: [derived_recalculation, manual_correction]
    AdjustmentType:
      type: string
      enum: [retroactive_increase, retroactive_decrease, salary_basis_correction, incapacity_correction]
    PayeeType:
      type: string
      enum: [employer, employee]
    PaymentRouteReason:
      type: string
      enum: [salary_continuation_active, direct_employee_payment, employer_reimbursement_override]
    InstructionStatus:
      type: string
      enum: [pending, exported, cancelled]
    SalaryModel:
      type: string
      enum: [monthly, annual, hourly, variable]
    BenefitActorRole:
      type: string
      enum: [claims_handler, team_lead, finance_operator, system]
    TransparentMoney:
      type: object
      properties:
        value:
          type: number
        currency:
          type: string
          enum: [CHF]
        formula:
          type: string
        inputs:
          type: object
          additionalProperties: true
        effectiveAt:
          type: string
          format: date-time
    BenefitCaseCalculation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        ktgCaseId:
          type: string
          format: uuid
        calculationStatus:
          $ref: '#/components/schemas/CalculationStatus'
        calculationReason:
          $ref: '#/components/schemas/CalculationReason'
        referenceDate:
          type: string
          format: date
        coverageSnapshotId:
          type: string
          format: uuid
        benefitDaysConsumed:
          type: number
        benefitDaysRemaining:
          type: number
        maxBenefitDays:
          type: number
        waitingDaysConsumed:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    InsuredSalarySnapshot:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        benefitCaseCalculationId:
          type: string
          format: uuid
        ktgCaseId:
          type: string
          format: uuid
          nullable: true
        salaryBasisDate:
          type: string
          format: date
        salaryModel:
          $ref: '#/components/schemas/SalaryModel'
        annualBaseSalaryChf:
          type: number
        included13thMonthChf:
          type: number
        insuredBonusChf:
          type: number
        insuredAllowancesChf:
          type: number
        employmentPercentage:
          type: number
        policyCapChf:
          type: number
        insuredSalaryChf:
          type: number
        formula:
          type: string
        inputsJson:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    CoordinationWindow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        benefitCaseCalculationId:
          type: string
          format: uuid
        windowType:
          $ref: '#/components/schemas/WindowType'
        windowStart:
          type: string
          format: date
        windowEnd:
          type: string
          format: date
        daysCount:
          type: number
        legalBasis:
          type: string
        sourceMethod:
          type: string
        formula:
          type: string
        inputsJson:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    BenefitEntitlementPeriod:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        benefitCaseCalculationId:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        periodType:
          $ref: '#/components/schemas/PeriodType'
        absenceEpisodeId:
          type: string
          format: uuid
          nullable: true
        sourceReferenceJson:
          type: object
          additionalProperties: true
        incapacityPercentage:
          type: number
        wartezeitApplicableFlag:
          type: boolean
        coordinationApplicableFlag:
          type: boolean
        benefitDays:
          type: number
        dailyAllowanceRateChf:
          type: number
        payableAmountChf:
          type: number
        formula:
          type: string
        inputsJson:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    BenefitDayBreakdown:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        benefitEntitlementPeriodId:
          type: string
          format: uuid
        benefitDate:
          type: string
          format: date
        absenceEpisodeId:
          type: string
          format: uuid
          nullable: true
        sourceReferenceJson:
          type: object
          additionalProperties: true
        incapacityPercentage:
          type: number
        salaryBasisPerDayChf:
          type: number
        coveragePercentage:
          type: number
        grossDailyAllowanceChf:
          type: number
        deductionReason:
          type: string
          nullable: true
        deductionAmountChf:
          type: number
        netDailyAllowanceChf:
          type: number
        payableFlag:
          type: boolean
        createdAt:
          type: string
          format: date-time
    BenefitAdjustment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        benefitCaseCalculationId:
          type: string
          format: uuid
        adjustmentOrigin:
          $ref: '#/components/schemas/AdjustmentOrigin'
        adjustmentType:
          $ref: '#/components/schemas/AdjustmentType'
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
        reasonCode:
          type: string
        deltaAmountChf:
          type: number
        formula:
          type: string
        inputsJson:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    PaymentInstruction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        ktgCaseId:
          type: string
          format: uuid
        benefitCaseCalculationId:
          type: string
          format: uuid
        payeeType:
          $ref: '#/components/schemas/PayeeType'
        payeeReference:
          type: string
        payeeIbanReference:
          type: string
          nullable: true
        paymentRouteReason:
          $ref: '#/components/schemas/PaymentRouteReason'
        salaryContinuationActiveFlag:
          type: boolean
        routingFormula:
          type: string
        routingInputsJson:
          type: object
          additionalProperties: true
        paymentPeriodStart:
          type: string
          format: date
        paymentPeriodEnd:
          type: string
          format: date
        grossAmountChf:
          type: number
        netAmountChf:
          type: number
        currency:
          type: string
          enum: [CHF]
        instructionStatus:
          $ref: '#/components/schemas/InstructionStatus'
        createdAt:
          type: string
          format: date-time
    TaggelddispositivSnapshot:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        ktgCaseId:
          type: string
          format: uuid
        paymentInstructionId:
          type: string
          format: uuid
        statementPeriodStart:
          type: string
          format: date
        statementPeriodEnd:
          type: string
          format: date
        totalClaimedDays:
          type: number
        totalPayableDays:
          type: number
        totalAmountChf:
          type: number
        statementPayloadJson:
          type: object
          additionalProperties: true
        generatedAt:
          type: string
          format: date-time
    CalculationAuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        ktgCaseId:
          type: string
          format: uuid
        benefitCaseCalculationId:
          type: string
          format: uuid
        eventType:
          type: string
        occurredAt:
          type: string
          format: date-time
        actorId:
          type: string
          format: uuid
          nullable: true
        actorRole:
          $ref: '#/components/schemas/BenefitActorRole'
        correlationId:
          type: string
          nullable: true
        payload:
          type: object
          additionalProperties: true
          nullable: true
    BenefitCaseCalculationDetail:
      allOf:
        - $ref: '#/components/schemas/BenefitCaseCalculation'
        - type: object
          properties:
            insuredSalarySnapshot:
              $ref: '#/components/schemas/InsuredSalarySnapshot'
            coordinationWindows:
              type: array
              items:
                $ref: '#/components/schemas/CoordinationWindow'
            entitlementPeriods:
              type: array
              items:
                $ref: '#/components/schemas/BenefitEntitlementPeriod'
            dayBreakdowns:
              type: array
              items:
                $ref: '#/components/schemas/BenefitDayBreakdown'
            adjustments:
              type: array
              items:
                $ref: '#/components/schemas/BenefitAdjustment'
            paymentInstructions:
              type: array
              items:
                $ref: '#/components/schemas/PaymentInstruction'
            taggelddispositive:
              type: array
              items:
                $ref: '#/components/schemas/TaggelddispositivSnapshot'
            auditEvents:
              type: array
              items:
                $ref: '#/components/schemas/CalculationAuditEvent'
    CreateBenefitCalculationRequest:
      type: object
      required: [ktgCaseId, calculationStatus, calculationReason, referenceDate, coverageSnapshotId, createdAt, updatedAt]
      properties:
        ktgCaseId:
          type: string
          format: uuid
        calculationStatus:
          $ref: '#/components/schemas/CalculationStatus'
        calculationReason:
          $ref: '#/components/schemas/CalculationReason'
        referenceDate:
          type: string
          format: date
        coverageSnapshotId:
          type: string
          format: uuid
        benefitDaysConsumed:
          type: number
          default: 0
        benefitDaysRemaining:
          type: number
          default: 0
        maxBenefitDays:
          type: number
          default: 730
        waitingDaysConsumed:
          type: number
          default: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateInsuredSalarySnapshotRequest:
      type: object
      required:
        [salaryBasisDate, salaryModel, annualBaseSalaryChf, included13thMonthChf, insuredBonusChf, insuredAllowancesChf, employmentPercentage, policyCapChf, insuredSalaryChf, formula, inputsJson, createdAt]
      properties:
        ktgCaseId:
          type: string
          format: uuid
        salaryBasisDate:
          type: string
          format: date
        salaryModel:
          $ref: '#/components/schemas/SalaryModel'
        annualBaseSalaryChf:
          type: number
        included13thMonthChf:
          type: number
        insuredBonusChf:
          type: number
        insuredAllowancesChf:
          type: number
        employmentPercentage:
          type: number
        policyCapChf:
          type: number
        insuredSalaryChf:
          type: number
        formula:
          type: string
        inputsJson:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    CreateCoordinationWindowRequest:
      type: object
      required: [windowType, windowStart, windowEnd, daysCount, legalBasis, sourceMethod, formula, inputsJson, createdAt]
      properties:
        windowType:
          $ref: '#/components/schemas/WindowType'
        windowStart:
          type: string
          format: date
        windowEnd:
          type: string
          format: date
        daysCount:
          type: number
        legalBasis:
          type: string
        sourceMethod:
          type: string
        formula:
          type: string
        inputsJson:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    CreateBenefitEntitlementPeriodRequest:
      type: object
      required:
        [periodStart, periodEnd, periodType, sourceReferenceJson, incapacityPercentage, wartezeitApplicableFlag, coordinationApplicableFlag, benefitDays, dailyAllowanceRateChf, payableAmountChf, formula, inputsJson, createdAt]
      properties:
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        periodType:
          $ref: '#/components/schemas/PeriodType'
        absenceEpisodeId:
          type: string
          format: uuid
        sourceReferenceJson:
          type: object
          additionalProperties: true
        incapacityPercentage:
          type: number
        wartezeitApplicableFlag:
          type: boolean
        coordinationApplicableFlag:
          type: boolean
        benefitDays:
          type: number
        dailyAllowanceRateChf:
          type: number
        payableAmountChf:
          type: number
        formula:
          type: string
        inputsJson:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    CreateBenefitDayBreakdownRequest:
      type: object
      required:
        [benefitDate, sourceReferenceJson, incapacityPercentage, salaryBasisPerDayChf, coveragePercentage, grossDailyAllowanceChf, deductionAmountChf, netDailyAllowanceChf, payableFlag, createdAt]
      properties:
        absenceEpisodeId:
          type: string
          format: uuid
        benefitDate:
          type: string
          format: date
        sourceReferenceJson:
          type: object
          additionalProperties: true
        incapacityPercentage:
          type: number
        salaryBasisPerDayChf:
          type: number
        coveragePercentage:
          type: number
        grossDailyAllowanceChf:
          type: number
        deductionReason:
          type: string
        deductionAmountChf:
          type: number
        netDailyAllowanceChf:
          type: number
        payableFlag:
          type: boolean
        createdAt:
          type: string
          format: date-time
    CreateBenefitAdjustmentRequest:
      type: object
      required: [adjustmentOrigin, adjustmentType, effectiveFrom, effectiveTo, reasonCode, deltaAmountChf, formula, inputsJson, createdAt]
      properties:
        adjustmentOrigin:
          $ref: '#/components/schemas/AdjustmentOrigin'
        adjustmentType:
          $ref: '#/components/schemas/AdjustmentType'
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
        reasonCode:
          type: string
        deltaAmountChf:
          type: number
        formula:
          type: string
        inputsJson:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    CreatePaymentInstructionRequest:
      type: object
      required:
        [ktgCaseId, payeeType, payeeReference, paymentRouteReason, salaryContinuationActiveFlag, routingFormula, routingInputsJson, paymentPeriodStart, paymentPeriodEnd, grossAmountChf, netAmountChf, currency, instructionStatus, createdAt]
      properties:
        ktgCaseId:
          type: string
          format: uuid
        payeeType:
          $ref: '#/components/schemas/PayeeType'
        payeeReference:
          type: string
        payeeIbanReference:
          type: string
        paymentRouteReason:
          $ref: '#/components/schemas/PaymentRouteReason'
        salaryContinuationActiveFlag:
          type: boolean
        routingFormula:
          type: string
        routingInputsJson:
          type: object
          additionalProperties: true
        paymentPeriodStart:
          type: string
          format: date
        paymentPeriodEnd:
          type: string
          format: date
        grossAmountChf:
          type: number
        netAmountChf:
          type: number
        currency:
          type: string
          enum: [CHF]
        instructionStatus:
          $ref: '#/components/schemas/InstructionStatus'
        createdAt:
          type: string
          format: date-time
    CreateTaggelddispositivRequest:
      type: object
      required:
        [ktgCaseId, statementPeriodStart, statementPeriodEnd, totalClaimedDays, totalPayableDays, totalAmountChf, statementPayloadJson, generatedAt]
      properties:
        ktgCaseId:
          type: string
          format: uuid
        statementPeriodStart:
          type: string
          format: date
        statementPeriodEnd:
          type: string
          format: date
        totalClaimedDays:
          type: number
        totalPayableDays:
          type: number
        totalAmountChf:
          type: number
        statementPayloadJson:
          type: object
          additionalProperties: true
        generatedAt:
          type: string
          format: date-time
