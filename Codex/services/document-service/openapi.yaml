openapi: 3.0.3
info:
  title: elipsLife Document Service API
  version: 0.1.0
  description: >
    Tenant-scoped encrypted document and medical-certificate management service.
servers:
  - url: https://api.elipslife.ch/document-service
security:
  - bearerAuth: []
tags:
  - name: Documents
  - name: Links
  - name: Versions
  - name: CertificateFacts
  - name: ExtractionJobs
  - name: AccessEvents
  - name: ConsentReferences
  - name: Coverage
paths:
  /v1/tenants/{tenantId}/documents:
    get:
      tags: [Documents]
      operationId: listDocuments
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - in: query
          name: employeeId
          schema:
            type: string
            format: uuid
        - in: query
          name: documentType
          schema:
            $ref: '#/components/schemas/DocumentType'
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/DocumentStatus'
      responses:
        '200':
          description: Document list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentSummary'
    post:
      tags: [Documents]
      operationId: createDocument
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
  /v1/tenants/{tenantId}/documents/{documentId}:
    get:
      tags: [Documents]
      operationId: getDocument
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Document detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
    patch:
      tags: [Documents]
      operationId: updateDocument
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDocumentRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
  /v1/tenants/{tenantId}/documents/{documentId}/links:
    post:
      tags: [Links]
      operationId: createDocumentLink
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentLinkRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentLink'
  /v1/tenants/{tenantId}/documents/{documentId}/versions:
    post:
      tags: [Versions]
      operationId: createDocumentVersion
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentVersionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersion'
  /v1/tenants/{tenantId}/documents/{documentId}/certificate-facts:
    post:
      tags: [CertificateFacts]
      operationId: createMedicalCertificateFact
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMedicalCertificateFactRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalCertificateFactDetail'
  /v1/tenants/{tenantId}/documents/{documentId}/extraction-jobs:
    post:
      tags: [ExtractionJobs]
      operationId: createDocumentExtractionJob
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentExtractionJobRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentExtractionJob'
  /v1/tenants/{tenantId}/documents/{documentId}/extraction-jobs/{jobId}:
    patch:
      tags: [ExtractionJobs]
      operationId: updateDocumentExtractionJob
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDocumentExtractionJobRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentExtractionJob'
  /v1/tenants/{tenantId}/documents/{documentId}/access-events:
    post:
      tags: [AccessEvents]
      operationId: createDocumentAccessEvent
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentAccessEventRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentAccessEvent'
  /v1/tenants/{tenantId}/documents/{documentId}/consent-references:
    post:
      tags: [ConsentReferences]
      operationId: createDocumentConsentReference
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentConsentReferenceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentConsentReference'
  /v1/tenants/{tenantId}/absence-episodes/{episodeId}/certificate-coverage:
    get:
      tags: [Coverage]
      operationId: getCertificateCoverageByEpisode
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EpisodeId'
      responses:
        '200':
          description: Coverage windows for an absence episode
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CertificateCoverageWindowDetail'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      in: path
      name: tenantId
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      in: path
      name: documentId
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      in: path
      name: jobId
      required: true
      schema:
        type: string
        format: uuid
    EpisodeId:
      in: path
      name: episodeId
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    DocumentType:
      type: string
      enum: [medical_certificate, hospital_discharge, specialist_referral, physio_confirmation, accident_report, other]
    DocumentCategory:
      type: string
      enum: [health_sensitive, claims_correspondence, payroll_support, administrative]
    DocumentSourceChannel:
      type: string
      enum: [employee_portal, hr_portal, claims_portal, integration, api, batch]
    DocumentActorRole:
      type: string
      enum: [employee, hr_manager, claims_handler, compliance_user, system, api]
    DocumentStatus:
      type: string
      enum: [uploaded, available, under_review, superseded, quarantined, deleted]
    LinkTargetType:
      type: string
      enum: [employee, absence_episode, absence_daily_record, ktg_case, uvg_case]
    ExtractionStatus:
      type: string
      enum: [pending, extracted, reviewed, rejected]
    ExtractionJobType:
      type: string
      enum: [ocr, medical_certificate_extraction, virus_scan, checksum_verification]
    ExtractionJobStatus:
      type: string
      enum: [pending, running, completed, failed, cancelled]
    AccessType:
      type: string
      enum: [view_metadata, generate_download, download_file, view_extraction, export_package]
    AccessResult:
      type: string
      enum: [allowed, denied]
    ProcessingPurpose:
      type: string
      enum: [absence_tracking, claims_assessment, certificate_validation, legal_retention, data_subject_request]
    CertificateStatus:
      type: string
      enum: [active, expiring, expired, replaced, invalidated]
    RetentionStatus:
      type: string
      enum: [active_retention, legal_hold, deletion_eligible, deleted_retained]
    DocumentSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
          nullable: true
        documentType:
          $ref: '#/components/schemas/DocumentType'
        documentCategory:
          $ref: '#/components/schemas/DocumentCategory'
        fileName:
          type: string
        mimeType:
          type: string
        fileSizeBytes:
          type: integer
        status:
          $ref: '#/components/schemas/DocumentStatus'
        retentionStatus:
          $ref: '#/components/schemas/RetentionStatus'
        uploadedAt:
          type: string
          format: date-time
    DocumentDetail:
      allOf:
        - $ref: '#/components/schemas/DocumentSummary'
        - type: object
          properties:
            uploaderUserId:
              type: string
              format: uuid
              nullable: true
            uploaderRole:
              $ref: '#/components/schemas/DocumentActorRole'
            sourceChannel:
              $ref: '#/components/schemas/DocumentSourceChannel'
            storageObjectKey:
              type: string
            storageRegion:
              type: string
              enum: [CH]
            checksumSha256:
              type: string
            encryptionKeyRef:
              type: string
            legalHoldFlag:
              type: boolean
            legalHoldReason:
              type: string
              nullable: true
            retentionUntil:
              type: string
              format: date
              nullable: true
            retentionPolicyCode:
              type: string
              nullable: true
            supersededByDocumentVersionId:
              type: string
              format: uuid
              nullable: true
            supersededAt:
              type: string
              format: date-time
              nullable: true
            deletedAt:
              type: string
              format: date-time
              nullable: true
            links:
              type: array
              items:
                $ref: '#/components/schemas/DocumentLink'
            versions:
              type: array
              items:
                $ref: '#/components/schemas/DocumentVersion'
            extractionJobs:
              type: array
              items:
                $ref: '#/components/schemas/DocumentExtractionJob'
            medicalCertificateFact:
              $ref: '#/components/schemas/MedicalCertificateFactDetail'
              nullable: true
            certificateCoverageWindow:
              $ref: '#/components/schemas/CertificateCoverageWindowDetail'
              nullable: true
            accessEvents:
              type: array
              items:
                $ref: '#/components/schemas/DocumentAccessEvent'
            consentReferences:
              type: array
              items:
                $ref: '#/components/schemas/DocumentConsentReference'
    CreateDocumentRequest:
      type: object
      required:
        - uploaderRole
        - documentType
        - documentCategory
        - sourceChannel
        - storageObjectKey
        - mimeType
        - fileName
        - fileSizeBytes
        - checksumSha256
        - encryptionKeyRef
        - uploadedAt
      properties:
        employeeId:
          type: string
          format: uuid
        uploaderUserId:
          type: string
          format: uuid
        uploaderRole:
          $ref: '#/components/schemas/DocumentActorRole'
        documentType:
          $ref: '#/components/schemas/DocumentType'
        documentCategory:
          $ref: '#/components/schemas/DocumentCategory'
        sourceChannel:
          $ref: '#/components/schemas/DocumentSourceChannel'
        storageObjectKey:
          type: string
        mimeType:
          type: string
        fileName:
          type: string
        fileSizeBytes:
          type: integer
        checksumSha256:
          type: string
        encryptionKeyRef:
          type: string
        legalHoldFlag:
          type: boolean
          default: false
        legalHoldReason:
          type: string
        retentionUntil:
          type: string
          format: date
        retentionPolicyCode:
          type: string
        uploadedAt:
          type: string
          format: date-time
    UpdateDocumentRequest:
      type: object
      properties:
        documentCategory:
          $ref: '#/components/schemas/DocumentCategory'
        status:
          $ref: '#/components/schemas/DocumentStatus'
        legalHoldFlag:
          type: boolean
        legalHoldReason:
          type: string
        retentionUntil:
          type: string
          format: date
        retentionPolicyCode:
          type: string
        deletedAt:
          type: string
          format: date-time
    DocumentLink:
      type: object
      properties:
        id:
          type: string
          format: uuid
        linkTargetType:
          $ref: '#/components/schemas/LinkTargetType'
        linkTargetId:
          type: string
          format: uuid
        isPrimary:
          type: boolean
        linkedAt:
          type: string
          format: date-time
    CreateDocumentLinkRequest:
      type: object
      required: [linkTargetType, linkTargetId, linkedAt]
      properties:
        linkTargetType:
          $ref: '#/components/schemas/LinkTargetType'
        linkTargetId:
          type: string
          format: uuid
        isPrimary:
          type: boolean
          default: false
        linkedAt:
          type: string
          format: date-time
    DocumentVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        versionNumber:
          type: integer
        storageObjectKey:
          type: string
        checksumSha256:
          type: string
        replacedDocumentVersionId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
    CreateDocumentVersionRequest:
      type: object
      required: [versionNumber, storageObjectKey, checksumSha256, createdAt]
      properties:
        versionNumber:
          type: integer
        storageObjectKey:
          type: string
        checksumSha256:
          type: string
        replacedDocumentVersionId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    DocumentExtractionJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        jobType:
          $ref: '#/components/schemas/ExtractionJobType'
        status:
          $ref: '#/components/schemas/ExtractionJobStatus'
        requestedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        provider:
          type: string
          nullable: true
        rawResultPayload:
          type: object
          additionalProperties: true
          nullable: true
        errorCode:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
    CreateDocumentExtractionJobRequest:
      type: object
      required: [jobType, requestedAt]
      properties:
        jobType:
          $ref: '#/components/schemas/ExtractionJobType'
        status:
          $ref: '#/components/schemas/ExtractionJobStatus'
        requestedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        provider:
          type: string
        rawResultPayload:
          type: object
          additionalProperties: true
        errorCode:
          type: string
        errorMessage:
          type: string
    UpdateDocumentExtractionJobRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ExtractionJobStatus'
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        provider:
          type: string
        rawResultPayload:
          type: object
          additionalProperties: true
        errorCode:
          type: string
        errorMessage:
          type: string
    MedicalCertificateFact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        absenceEpisodeId:
          type: string
          format: uuid
          nullable: true
        certificateReferenceId:
          type: string
          format: uuid
        firstDayOfIncapacity:
          type: string
          format: date
        certificateStartDate:
          type: string
          format: date
        certificateEndDate:
          type: string
          format: date
          nullable: true
        incapacityPercentage:
          type: number
        issuedOn:
          type: string
          format: date
          nullable: true
        issuingProviderName:
          type: string
          nullable: true
        extractionStatus:
          $ref: '#/components/schemas/ExtractionStatus'
        extractionConfidence:
          type: number
          nullable: true
        reviewRequiredFlag:
          type: boolean
        reviewedBy:
          type: string
          format: uuid
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        supersededByDocumentVersionId:
          type: string
          format: uuid
          nullable: true
        supersededAt:
          type: string
          format: date-time
          nullable: true
    MedicalCertificateFactDetail:
      allOf:
        - $ref: '#/components/schemas/MedicalCertificateFact'
        - type: object
          properties:
            reviewRequired:
              $ref: '#/components/schemas/TransparentBoolean'
    CreateMedicalCertificateFactRequest:
      type: object
      required:
        - certificateReferenceId
        - firstDayOfIncapacity
        - certificateStartDate
        - incapacityPercentage
        - extractionStatus
      properties:
        absenceEpisodeId:
          type: string
          format: uuid
        certificateReferenceId:
          type: string
          format: uuid
        firstDayOfIncapacity:
          type: string
          format: date
        certificateStartDate:
          type: string
          format: date
        certificateEndDate:
          type: string
          format: date
        incapacityPercentage:
          type: number
        issuedOn:
          type: string
          format: date
        issuingProviderName:
          type: string
        extractionStatus:
          $ref: '#/components/schemas/ExtractionStatus'
        extractionConfidence:
          type: number
        reviewedBy:
          type: string
          format: uuid
        reviewedAt:
          type: string
          format: date-time
    CertificateCoverageWindow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        absenceEpisodeId:
          type: string
          format: uuid
          nullable: true
        medicalCertificateFactId:
          type: string
          format: uuid
        coveredFrom:
          type: string
          format: date
        coveredTo:
          type: string
          format: date
          nullable: true
        certificateStatus:
          $ref: '#/components/schemas/CertificateStatus'
        expiryAlertAt:
          type: string
          format: date-time
          nullable: true
    CertificateCoverageWindowDetail:
      allOf:
        - $ref: '#/components/schemas/CertificateCoverageWindow'
        - type: object
          properties:
            coverageEvaluation:
              $ref: '#/components/schemas/TransparentCoverageWindow'
    DocumentAccessEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
          nullable: true
        actorRole:
          $ref: '#/components/schemas/DocumentActorRole'
        accessType:
          $ref: '#/components/schemas/AccessType'
        purposeOfUse:
          $ref: '#/components/schemas/ProcessingPurpose'
        correlationId:
          type: string
          nullable: true
        accessedAt:
          type: string
          format: date-time
        result:
          $ref: '#/components/schemas/AccessResult'
    CreateDocumentAccessEventRequest:
      type: object
      required: [actorRole, accessType, purposeOfUse, accessedAt, result]
      properties:
        actorId:
          type: string
          format: uuid
        actorRole:
          $ref: '#/components/schemas/DocumentActorRole'
        accessType:
          $ref: '#/components/schemas/AccessType'
        purposeOfUse:
          $ref: '#/components/schemas/ProcessingPurpose'
        correlationId:
          type: string
        accessedAt:
          type: string
          format: date-time
        result:
          $ref: '#/components/schemas/AccessResult'
    DocumentConsentReference:
      type: object
      properties:
        id:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        consentRecordId:
          type: string
          format: uuid
        processingPurpose:
          $ref: '#/components/schemas/ProcessingPurpose'
        recordedAt:
          type: string
          format: date-time
    CreateDocumentConsentReferenceRequest:
      type: object
      required: [employeeId, consentRecordId, processingPurpose, recordedAt]
      properties:
        employeeId:
          type: string
          format: uuid
        consentRecordId:
          type: string
          format: uuid
        processingPurpose:
          $ref: '#/components/schemas/ProcessingPurpose'
        recordedAt:
          type: string
          format: date-time
    TransparentBoolean:
      type: object
      properties:
        value:
          type: boolean
        formula:
          type: string
        inputs:
          type: object
          additionalProperties: true
        effectiveAt:
          type: string
          format: date-time
    TransparentCoverageWindow:
      type: object
      properties:
        value:
          type: object
          properties:
            coveredFrom:
              type: string
              format: date
            coveredTo:
              type: string
              format: date
              nullable: true
            certificateStatus:
              $ref: '#/components/schemas/CertificateStatus'
            expiryAlertAt:
              type: string
              format: date
              nullable: true
        formula:
          type: string
        inputs:
          type: object
          additionalProperties: true
        effectiveAt:
          type: string
          format: date
