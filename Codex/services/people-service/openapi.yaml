openapi: 3.0.3
info:
  title: elipsLife People Service API
  version: 0.1.0
  description: >
    Tenant-scoped employee master data service for Swiss absence and claims workflows.
servers:
  - url: https://api.elipslife.ch/people-service
security:
  - bearerAuth: []
tags:
  - name: Tenants
  - name: Employees
  - name: EmploymentContracts
  - name: SalaryRecords
  - name: CoverageEligibilities
  - name: Integrations
  - name: Consents
  - name: Audit
paths:
  /v1/tenants:
    post:
      tags: [Tenants]
      operationId: createTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
  /v1/tenants/{tenantId}:
    get:
      tags: [Tenants]
      operationId: getTenant
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Tenant details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
  /v1/tenants/{tenantId}/legal-entities:
    post:
      tags: [Tenants]
      operationId: createLegalEntity
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLegalEntityRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientLegalEntity'
  /v1/tenants/{tenantId}/employees:
    get:
      tags: [Employees]
      operationId: listEmployees
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: legalEntityId
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive]
      responses:
        '200':
          description: Employee list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmployeeSummary'
                  page:
                    $ref: '#/components/schemas/PageMeta'
    post:
      tags: [Employees]
      operationId: createEmployee
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDetail'
  /v1/tenants/{tenantId}/employees/{employeeId}:
    get:
      tags: [Employees]
      operationId: getEmployee
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EmployeeId'
      responses:
        '200':
          description: Employee detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDetail'
    patch:
      tags: [Employees]
      operationId: updateEmployee
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EmployeeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDetail'
  /v1/tenants/{tenantId}/employees/{employeeId}/employment-contracts:
    post:
      tags: [EmploymentContracts]
      operationId: createEmploymentContract
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EmployeeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmploymentContractRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmploymentContract'
  /v1/tenants/{tenantId}/employment-contracts/{contractId}/salary-records:
    post:
      tags: [SalaryRecords]
      operationId: createSalaryRecord
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ContractId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSalaryRecordRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryRecord'
  /v1/tenants/{tenantId}/employment-contracts/{contractId}/coverage-eligibilities:
    post:
      tags: [CoverageEligibilities]
      operationId: createCoverageEligibility
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ContractId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCoverageEligibilityRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageEligibility'
  /v1/tenants/{tenantId}/employees/{employeeId}/insured-salary-preview:
    get:
      tags: [Employees]
      operationId: getInsuredSalaryPreview
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EmployeeId'
        - in: query
          name: contractId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: effectiveDate
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Transparent salary basis preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsuredSalaryPreview'
  /v1/tenants/{tenantId}/integrations/{integrationSourceId}/sync-jobs/import:
    post:
      tags: [Integrations]
      operationId: importSyncJob
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IntegrationSourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportSyncJobRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedJob'
  /v1/tenants/{tenantId}/imports/errors:
    get:
      tags: [Integrations]
      operationId: listImportErrors
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - in: query
          name: status
          schema:
            type: string
            enum: [open, retrying, resolved, ignored]
      responses:
        '200':
          description: Import errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImportError'
  /v1/tenants/{tenantId}/employees/{employeeId}/change-events:
    get:
      tags: [Audit]
      operationId: listEmployeeChangeEvents
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EmployeeId'
      responses:
        '200':
          description: Change history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MasterDataChangeEvent'
  /v1/tenants/{tenantId}/employees/{employeeId}/consents:
    post:
      tags: [Consents]
      operationId: createConsent
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EmployeeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConsentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      in: path
      name: tenantId
      required: true
      schema:
        type: string
        format: uuid
    EmployeeId:
      in: path
      name: employeeId
      required: true
      schema:
        type: string
        format: uuid
    ContractId:
      in: path
      name: contractId
      required: true
      schema:
        type: string
        format: uuid
    IntegrationSourceId:
      in: path
      name: integrationSourceId
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        elipsClientNumber:
          type: string
        legalName:
          type: string
        status:
          type: string
        defaultLanguage:
          type: string
    CreateTenantRequest:
      type: object
      required: [elipsClientNumber, legalName]
      properties:
        elipsClientNumber:
          type: string
        legalName:
          type: string
        defaultLanguage:
          type: string
          default: de-CH
    ClientLegalEntity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        uidNumber:
          type: string
        iban:
          type: string
        activeFrom:
          type: string
          format: date
        activeTo:
          type: string
          format: date
          nullable: true
    CreateLegalEntityRequest:
      type: object
      required: [name, activeFrom]
      properties:
        name:
          type: string
        uidNumber:
          type: string
        iban:
          type: string
        activeFrom:
          type: string
          format: date
        activeTo:
          type: string
          format: date
          nullable: true
    EmployeeSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        personnelNumber:
          type: string
        displayName:
          type: string
        preferredLanguage:
          type: string
        activeFlag:
          type: boolean
        latestMutationAt:
          type: string
          format: date-time
        integrationStatus:
          type: string
        portalStatus:
          type: string
    EmployeeDetail:
      allOf:
        - $ref: '#/components/schemas/EmployeeSummary'
        - type: object
          properties:
            firstName:
              type: string
            lastName:
              type: string
            preferredName:
              type: string
              nullable: true
            dateOfBirth:
              type: string
              format: date
            ahvNumberMasked:
              type: string
            nationalityCode:
              type: string
              nullable: true
            workEmail:
              type: string
              format: email
              nullable: true
            privateEmail:
              type: string
              format: email
              nullable: true
            mobilePhone:
              type: string
              nullable: true
            contracts:
              type: array
              items:
                $ref: '#/components/schemas/EmploymentContract'
            consents:
              type: array
              items:
                $ref: '#/components/schemas/ConsentRecord'
    CreateEmployeeRequest:
      type: object
      required:
        - personnelNumber
        - firstName
        - lastName
        - dateOfBirth
      properties:
        personnelNumber:
          type: string
        externalPersonId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        preferredName:
          type: string
        dateOfBirth:
          type: string
          format: date
        ahvNumber:
          type: string
          description: Plain AHV accepted only via secure internal channel.
        nationalityCode:
          type: string
        workEmail:
          type: string
          format: email
        privateEmail:
          type: string
          format: email
        mobilePhone:
          type: string
        preferredLanguage:
          type: string
          default: de-CH
    UpdateEmployeeRequest:
      type: object
      properties:
        preferredName:
          type: string
        nationalityCode:
          type: string
        workEmail:
          type: string
          format: email
        privateEmail:
          type: string
          format: email
        mobilePhone:
          type: string
        preferredLanguage:
          type: string
        activeFlag:
          type: boolean
    EmploymentContract:
      type: object
      properties:
        id:
          type: string
          format: uuid
        employmentNumber:
          type: string
        contractType:
          type: string
        workPatternType:
          type: string
        workingTimeModel:
          type: string
          enum: [fixed_schedule, annualized_hours, shift, irregular]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        employmentPercentage:
          type: number
        weeklyHours:
          type: number
          nullable: true
        legalEntityId:
          type: string
          format: uuid
        orgUnitId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [active, terminated, suspended, on_leave]
    CreateEmploymentContractRequest:
      type: object
      required:
        - legalEntityId
        - employmentNumber
        - contractType
        - workPatternType
        - workingTimeModel
        - startDate
        - employmentPercentage
      properties:
        legalEntityId:
          type: string
          format: uuid
        employmentNumber:
          type: string
        contractType:
          type: string
          enum: [permanent, fixed_term, hourly, apprenticeship, executive, other]
        workPatternType:
          type: string
          enum: [full_time, part_time, shift, irregular, hourly]
        workingTimeModel:
          type: string
          enum: [fixed_schedule, annualized_hours, shift, irregular]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        employmentPercentage:
          type: number
        weeklyHours:
          type: number
        managerEmployeeId:
          type: string
          format: uuid
        orgUnitId:
          type: string
          format: uuid
        payrollReference:
          type: string
        status:
          type: string
          enum: [active, terminated, suspended, on_leave]
          default: active
    SalaryRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
          nullable: true
        salaryModel:
          type: string
        baseSalaryAmount:
          type: number
        currency:
          type: string
        thirteenthMonthRule:
          type: string
        bonusTargetAmount:
          type: number
        bonusInsuredFlag:
          type: boolean
        allowancesAmount:
          type: number
        ahvRelevantSalaryAmount:
          type: number
          nullable: true
    CreateSalaryRecordRequest:
      type: object
      required:
        - validFrom
        - salaryModel
        - baseSalaryAmount
      properties:
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
          nullable: true
        salaryModel:
          type: string
          enum: [monthly, annual, hourly, variable]
        baseSalaryAmount:
          type: number
        currency:
          type: string
          default: CHF
        thirteenthMonthRule:
          type: string
          enum: [not_included, included_in_base, paid_separately]
        bonusTargetAmount:
          type: number
        bonusInsuredFlag:
          type: boolean
        allowancesAmount:
          type: number
        ahvRelevantSalaryAmount:
          type: number
        fteReferencePercentage:
          type: number
    CoverageEligibility:
      type: object
      properties:
        id:
          type: string
          format: uuid
        policyId:
          type: string
        coverageType:
          type: string
        insuredFrom:
          type: string
          format: date
        insuredTo:
          type: string
          format: date
          nullable: true
        eligibilityStatus:
          type: string
        occupationClass:
          type: string
          nullable: true
        riskGroup:
          type: string
          nullable: true
        salaryBasisRuleVersion:
          type: string
    CreateCoverageEligibilityRequest:
      type: object
      required:
        - policyId
        - coverageType
        - insuredFrom
        - salaryBasisRuleVersion
      properties:
        policyId:
          type: string
        coverageType:
          type: string
          enum: [ktg, uvg_bu, uvg_nbu, uvg_zusatz]
        insuredFrom:
          type: string
          format: date
        insuredTo:
          type: string
          format: date
          nullable: true
        eligibilityStatus:
          type: string
          enum: [eligible, waiting_for_policy_sync, excluded, suspended]
        occupationClass:
          type: string
        riskGroup:
          type: string
        salaryBasisRuleVersion:
          type: string
    ImportSyncJobRequest:
      type: object
      required: [mode, records]
      properties:
        mode:
          type: string
          enum: [upsert, validate_only]
        records:
          type: array
          items:
            type: object
            additionalProperties: true
    AcceptedJob:
      type: object
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          example: accepted
    ImportError:
      type: object
      properties:
        id:
          type: string
          format: uuid
        entityType:
          type: string
        externalId:
          type: string
        errorCode:
          type: string
        errorMessage:
          type: string
        retryCount:
          type: integer
        status:
          type: string
        createdAt:
          type: string
          format: date-time
    MasterDataChangeEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        entityType:
          type: string
        entityId:
          type: string
          format: uuid
        changeType:
          type: string
        source:
          type: string
        effectiveAt:
          type: string
          format: date-time
        correlationId:
          type: string
          nullable: true
        payloadBefore:
          type: object
          additionalProperties: true
          nullable: true
        payloadAfter:
          type: object
          additionalProperties: true
          nullable: true
    CreateConsentRequest:
      type: object
      required: [consentType, grantedAt, captureChannel, policyVersion]
      properties:
        consentType:
          type: string
          enum:
            - employee_portal_access
            - medical_document_processing
            - notifications
            - data_sharing
        grantedAt:
          type: string
          format: date-time
        captureChannel:
          type: string
        policyVersion:
          type: string
    ConsentRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        consentType:
          type: string
        grantedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        captureChannel:
          type: string
        policyVersion:
          type: string
    InsuredSalaryPreview:
      type: object
      properties:
        value:
          type: number
        formula:
          type: string
        inputs:
          type: object
          additionalProperties: true
        effectiveAt:
          type: string
          format: date
        warnings:
          type: array
          items:
            type: string
    PageMeta:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
