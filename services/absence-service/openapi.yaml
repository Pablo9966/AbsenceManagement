openapi: 3.0.3
info:
  title: elipsLife Absence Service API
  version: 0.1.0
  description: >
    Tenant-scoped absence recording service for sickness, accident, and related leave events.
servers:
  - url: https://api.elipslife.ch/absence-service
security:
  - bearerAuth: []
tags:
  - name: AbsenceEpisodes
  - name: ContractImpacts
  - name: DailyRecords
  - name: StatusTransitions
  - name: Comments
  - name: Recurrence
  - name: Analytics
paths:
  /v1/tenants/{tenantId}/absence-episodes:
    get:
      tags: [AbsenceEpisodes]
      operationId: listAbsenceEpisodes
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - in: query
          name: employeeId
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/AbsenceStatus'
        - in: query
          name: from
          schema:
            type: string
            format: date
        - in: query
          name: to
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Episode list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AbsenceEpisodeSummary'
    post:
      tags: [AbsenceEpisodes]
      operationId: createAbsenceEpisode
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAbsenceEpisodeRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceEpisodeDetail'
  /v1/tenants/{tenantId}/absence-episodes/{episodeId}:
    get:
      tags: [AbsenceEpisodes]
      operationId: getAbsenceEpisode
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EpisodeId'
      responses:
        '200':
          description: Episode detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceEpisodeDetail'
    patch:
      tags: [AbsenceEpisodes]
      operationId: updateAbsenceEpisode
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EpisodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAbsenceEpisodeRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceEpisodeDetail'
  /v1/tenants/{tenantId}/absence-episodes/{episodeId}/contract-impacts:
    post:
      tags: [ContractImpacts]
      operationId: createContractImpact
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EpisodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContractImpactRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceContractImpact'
  /v1/tenants/{tenantId}/absence-episodes/{episodeId}/daily-records:
    post:
      tags: [DailyRecords]
      operationId: createDailyRecord
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EpisodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDailyRecordRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceDailyRecord'
  /v1/tenants/{tenantId}/absence-episodes/{episodeId}/status-transitions:
    post:
      tags: [StatusTransitions]
      operationId: transitionAbsenceEpisodeStatus
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EpisodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionAbsenceStatusRequest'
      responses:
        '200':
          description: Transition recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceEpisodeDetail'
  /v1/tenants/{tenantId}/absence-episodes/{episodeId}/comments:
    post:
      tags: [Comments]
      operationId: createAbsenceComment
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EpisodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAbsenceCommentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceComment'
  /v1/tenants/{tenantId}/absence-episodes/{episodeId}/recurrence-link:
    post:
      tags: [Recurrence]
      operationId: linkAbsenceEpisodeToRecurrenceGroup
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EpisodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkRecurrenceGroupRequest'
      responses:
        '200':
          description: Linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceEpisodeDetail'
  /v1/tenants/{tenantId}/employees/{employeeId}/absence-timeline:
    get:
      tags: [Analytics]
      operationId: getEmployeeAbsenceTimeline
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EmployeeId'
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Employee timeline
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AbsenceTimelineItem'
  /v1/tenants/{tenantId}/employees/{employeeId}/bradford-factor:
    get:
      tags: [Analytics]
      operationId: getEmployeeBradfordFactor
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EmployeeId'
        - in: query
          name: windowStart
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: windowEnd
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: includeAbsenceType
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AbsenceType'
          style: form
          explode: true
      responses:
        '200':
          description: Bradford Factor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BradfordFactor'
  /v1/tenants/{tenantId}/absence-calendar:
    get:
      tags: [Analytics]
      operationId: getAbsenceCalendar
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: managerEmployeeId
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Calendar rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AbsenceEpisodeSummary'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      in: path
      name: tenantId
      required: true
      schema:
        type: string
        format: uuid
    EpisodeId:
      in: path
      name: episodeId
      required: true
      schema:
        type: string
        format: uuid
    EmployeeId:
      in: path
      name: employeeId
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    AbsenceType:
      type: string
      enum: [ktg_sickness, uvg_bu, uvg_nbu, eo_maternity, eo_military, other_leave]
    AbsenceStatus:
      type: string
      enum: [reported, acknowledged, in_progress, partially_returned, closed, cancelled]
    AbsenceSource:
      type: string
      enum: [employee_portal, hr_portal, line_manager, integration, api, batch]
    AbsenceActorRole:
      type: string
      enum: [employee, hr_manager, payroll_manager, line_manager, system]
    CommentVisibility:
      type: string
      enum: [hr_internal, manager_visible, employee_visible, system_internal]
    AbsenceEpisodeSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        primaryAbsenceType:
          $ref: '#/components/schemas/AbsenceType'
        status:
          $ref: '#/components/schemas/AbsenceStatus'
        startDate:
          type: string
          format: date
        firstDayOfIncapacity:
          type: string
          format: date
          nullable: true
        expectedEndDate:
          type: string
          format: date
          nullable: true
        actualEndDate:
          type: string
          format: date
          nullable: true
        lineManagerAckRequired:
          type: boolean
        recurrenceGroupId:
          type: string
          format: uuid
          nullable: true
    AbsenceEpisodeDetail:
      allOf:
        - $ref: '#/components/schemas/AbsenceEpisodeSummary'
        - type: object
          properties:
            source:
              $ref: '#/components/schemas/AbsenceSource'
            reportedAt:
              type: string
              format: date-time
            reportedByRole:
              $ref: '#/components/schemas/AbsenceActorRole'
            reasonCategory:
              type: string
              nullable: true
            reasonSubcategory:
              type: string
              nullable: true
            firstDayOfIncapacity:
              type: string
              format: date
              nullable: true
            lineManagerAcknowledgedAt:
              type: string
              format: date-time
              nullable: true
            contractImpacts:
              type: array
              items:
                $ref: '#/components/schemas/AbsenceContractImpact'
            dailyRecords:
              type: array
              items:
                $ref: '#/components/schemas/AbsenceDailyRecord'
            comments:
              type: array
              items:
                $ref: '#/components/schemas/AbsenceComment'
            statusEvents:
              type: array
              items:
                $ref: '#/components/schemas/AbsenceStatusEvent'
    CreateAbsenceEpisodeRequest:
      type: object
      required:
        - employeeId
        - primaryAbsenceType
        - source
        - reportedAt
        - reportedByRole
        - startDate
      properties:
        employeeId:
          type: string
          format: uuid
        primaryAbsenceType:
          $ref: '#/components/schemas/AbsenceType'
        source:
          $ref: '#/components/schemas/AbsenceSource'
        reportedAt:
          type: string
          format: date-time
        reportedByRole:
          $ref: '#/components/schemas/AbsenceActorRole'
        reportedByUserId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        firstDayOfIncapacity:
          type: string
          format: date
          nullable: true
        expectedEndDate:
          type: string
          format: date
          nullable: true
        reasonCategory:
          type: string
        reasonSubcategory:
          type: string
        lineManagerAckRequired:
          type: boolean
          default: false
    UpdateAbsenceEpisodeRequest:
      type: object
      properties:
        expectedEndDate:
          type: string
          format: date
          nullable: true
        actualEndDate:
          type: string
          format: date
          nullable: true
        reasonCategory:
          type: string
        reasonSubcategory:
          type: string
        lineManagerAckRequired:
          type: boolean
    AbsenceContractImpact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        episodeId:
          type: string
          format: uuid
        employmentContractId:
          type: string
          format: uuid
        affectedEmploymentPercentage:
          type: number
        employmentPercentageSnapshot:
          type: number
        workingTimeModel:
          type: string
          enum: [fixed_schedule, annualized_hours, shift, irregular]
        scheduledHoursPerWeekSnapshot:
          type: number
          nullable: true
    CreateContractImpactRequest:
      type: object
      required:
        - employmentContractId
        - affectedEmploymentPercentage
        - employmentPercentageSnapshot
        - workingTimeModel
      properties:
        employmentContractId:
          type: string
          format: uuid
        affectedEmploymentPercentage:
          type: number
        employmentPercentageSnapshot:
          type: number
        workingTimeModel:
          type: string
          enum: [fixed_schedule, annualized_hours, shift, irregular]
        scheduledHoursPerWeekSnapshot:
          type: number
    AbsenceDailyRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        contractImpactId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        employmentContractId:
          type: string
          format: uuid
        absenceDate:
          type: string
          format: date
        incapacityPercentage:
          type: number
        partialDayPercentage:
          type: number
        scheduledWorkMinutes:
          type: integer
          nullable: true
        lostWorkMinutes:
          type: integer
          nullable: true
        certifiedFlag:
          type: boolean
        certificateReferenceId:
          type: string
          format: uuid
          nullable: true
        returnToWorkFlag:
          type: boolean
        coordinatedOverlapFlag:
          type: boolean
        absenceDayEquivalent:
          $ref: '#/components/schemas/AbsenceDayEquivalent'
    CreateDailyRecordRequest:
      type: object
      required:
        - contractImpactId
        - employeeId
        - employmentContractId
        - absenceDate
        - incapacityPercentage
        - partialDayPercentage
      properties:
        contractImpactId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        employmentContractId:
          type: string
          format: uuid
        absenceDate:
          type: string
          format: date
        incapacityPercentage:
          type: number
        partialDayPercentage:
          type: number
          default: 100
        scheduledWorkMinutes:
          type: integer
        lostWorkMinutes:
          type: integer
        certifiedFlag:
          type: boolean
          default: false
        certificateReferenceId:
          type: string
          format: uuid
        returnToWorkFlag:
          type: boolean
          default: false
        coordinatedOverlapFlag:
          type: boolean
          default: false
    TransitionAbsenceStatusRequest:
      type: object
      required:
        - toStatus
        - eventAt
        - actorRole
      properties:
        toStatus:
          $ref: '#/components/schemas/AbsenceStatus'
        eventAt:
          type: string
          format: date-time
        actorId:
          type: string
          format: uuid
        actorRole:
          $ref: '#/components/schemas/AbsenceActorRole'
        correlationId:
          type: string
        payload:
          type: object
          additionalProperties: true
    AbsenceStatusEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fromStatus:
          $ref: '#/components/schemas/AbsenceStatus'
          nullable: true
        toStatus:
          $ref: '#/components/schemas/AbsenceStatus'
        eventType:
          type: string
        eventAt:
          type: string
          format: date-time
        actorId:
          type: string
          format: uuid
          nullable: true
        actorRole:
          $ref: '#/components/schemas/AbsenceActorRole'
        correlationId:
          type: string
          nullable: true
        payload:
          type: object
          additionalProperties: true
          nullable: true
    CreateAbsenceCommentRequest:
      type: object
      required:
        - authorRole
        - visibility
        - message
      properties:
        authorId:
          type: string
          format: uuid
        authorRole:
          $ref: '#/components/schemas/AbsenceActorRole'
        visibility:
          $ref: '#/components/schemas/CommentVisibility'
        message:
          type: string
    AbsenceComment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
          nullable: true
        authorRole:
          $ref: '#/components/schemas/AbsenceActorRole'
        visibility:
          $ref: '#/components/schemas/CommentVisibility'
        message:
          type: string
        createdAt:
          type: string
          format: date-time
    LinkRecurrenceGroupRequest:
      type: object
      required:
        - recurrenceBasis
      properties:
        recurrenceGroupId:
          type: string
          format: uuid
        recurrenceBasis:
          type: string
          enum: [same_condition_reported, manual_linked, claims_linked]
        eventAt:
          type: string
          format: date-time
    AbsenceTimelineItem:
      type: object
      properties:
        episodeId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        primaryAbsenceType:
          $ref: '#/components/schemas/AbsenceType'
        status:
          $ref: '#/components/schemas/AbsenceStatus'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        dayEquivalents:
          type: number
        recurrenceGroupId:
          type: string
          format: uuid
          nullable: true
    AbsenceDayEquivalent:
      type: object
      properties:
        value:
          type: number
        formula:
          type: string
        inputs:
          type: object
          additionalProperties: true
        effectiveAt:
          type: string
          format: date
        method:
          type: string
          enum: [minutes, percentages]
    BradfordFactor:
      type: object
      properties:
        value:
          type: number
        formula:
          type: string
        inputs:
          type: object
          additionalProperties: true
        windowStart:
          type: string
          format: date
        windowEnd:
          type: string
          format: date
