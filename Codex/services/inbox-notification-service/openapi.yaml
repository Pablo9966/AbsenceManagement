openapi: 3.0.3
info:
  title: elipsLife Inbox Notification Service API
  version: 0.1.0
  description: >
    Tenant-scoped inbox and notification workflow service for action obligations and delivery attempts.
servers:
  - url: https://api.elipslife.ch/inbox-notification-service
security:
  - bearerAuth: []
tags:
  - name: NotificationEvents
  - name: InboxItems
  - name: Assignments
  - name: Preferences
  - name: Templates
  - name: Deliveries
  - name: Suppressions
paths:
  /v1/tenants/{tenantId}/notification-events:
    post:
      tags: [NotificationEvents]
      operationId: createNotificationEvent
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationEventRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationEventCreationResult'
  /v1/tenants/{tenantId}/inbox-items:
    get:
      tags: [InboxItems]
      operationId: listInboxItems
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - in: query
          name: audienceUserId
          schema:
            type: string
            format: uuid
        - in: query
          name: audienceRole
          schema:
            type: string
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/InboxStatus'
      responses:
        '200':
          description: Inbox items
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InboxItem'
  /v1/tenants/{tenantId}/inbox-items/{inboxItemId}:
    get:
      tags: [InboxItems]
      operationId: getInboxItem
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/InboxItemId'
      responses:
        '200':
          description: Inbox item detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxItemDetail'
    patch:
      tags: [InboxItems]
      operationId: updateInboxItem
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/InboxItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInboxItemRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxItem'
  /v1/tenants/{tenantId}/inbox-items/{inboxItemId}/assignments:
    post:
      tags: [Assignments]
      operationId: createInboxItemAssignment
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/InboxItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInboxItemAssignmentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxItemAssignment'
  /v1/tenants/{tenantId}/notification-preferences:
    get:
      tags: [Preferences]
      operationId: listNotificationPreferences
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - in: query
          name: userId
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationPreference'
    post:
      tags: [Preferences]
      operationId: createNotificationPreference
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationPreferenceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'
  /v1/tenants/{tenantId}/notification-preferences/{preferenceId}:
    patch:
      tags: [Preferences]
      operationId: updateNotificationPreference
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PreferenceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationPreferenceRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'
  /v1/tenants/{tenantId}/notification-templates:
    get:
      tags: [Templates]
      operationId: listNotificationTemplates
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - in: query
          name: notificationType
          schema:
            $ref: '#/components/schemas/NotificationType'
        - in: query
          name: channel
          schema:
            $ref: '#/components/schemas/NotificationChannel'
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationTemplate'
    post:
      tags: [Templates]
      operationId: createNotificationTemplate
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationTemplateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTemplate'
  /v1/tenants/{tenantId}/notification-deliveries:
    post:
      tags: [Deliveries]
      operationId: createNotificationDelivery
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationDeliveryRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDelivery'
  /v1/tenants/{tenantId}/notification-deliveries/{deliveryId}:
    patch:
      tags: [Deliveries]
      operationId: updateNotificationDelivery
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/DeliveryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationDeliveryRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDelivery'
  /v1/tenants/{tenantId}/delivery-suppressions:
    get:
      tags: [Suppressions]
      operationId: listDeliverySuppressions
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - in: query
          name: recipientUserId
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Suppressions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeliverySuppression'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      in: path
      name: tenantId
      required: true
      schema:
        type: string
        format: uuid
    InboxItemId:
      in: path
      name: inboxItemId
      required: true
      schema:
        type: string
        format: uuid
    PreferenceId:
      in: path
      name: preferenceId
      required: true
      schema:
        type: string
        format: uuid
    DeliveryId:
      in: path
      name: deliveryId
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    AudienceType:
      type: string
      enum: [user, role]
    InboxPriority:
      type: string
      enum: [low, medium, high, urgent]
    InboxStatus:
      type: string
      enum: [open, acknowledged, resolved, cancelled]
    AssignmentStatus:
      type: string
      enum: [assigned, accepted, released]
    SourceType:
      type: string
      enum: [absence_episode, ktg_case, document, system]
    NotificationChannel:
      type: string
      enum: [in_app, email, sms]
    NotificationType:
      type: string
      enum: [certificate_expiring, case_submission_blocked, deadline_overdue, absence_reported, return_to_work_due, system_alert, manual]
    TemplateScopeType:
      type: string
      enum: [global, tenant]
    DeliveryStatus:
      type: string
      enum: [pending, queued, sent, failed, suppressed]
    SuppressionReason:
      type: string
      enum: [preference_disabled, quiet_hours, duplicate_delivery_guard, channel_unavailable]
    NotificationEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventType:
          $ref: '#/components/schemas/NotificationType'
        sourceType:
          $ref: '#/components/schemas/SourceType'
        sourceId:
          type: string
          format: uuid
        correlationId:
          type: string
          nullable: true
        triggeredAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
    InboxItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        audienceType:
          $ref: '#/components/schemas/AudienceType'
        audienceUserId:
          type: string
          format: uuid
          nullable: true
        audienceRole:
          type: string
          nullable: true
        sourceType:
          $ref: '#/components/schemas/SourceType'
        sourceId:
          type: string
          format: uuid
        title:
          type: string
        summary:
          type: string
        priority:
          $ref: '#/components/schemas/InboxPriority'
        dueAt:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/InboxStatus'
        primaryActionLabel:
          type: string
          nullable: true
        primaryActionUrl:
          type: string
          nullable: true
        secondaryActionUrl:
          type: string
          nullable: true
        notificationEventId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true
    InboxItemAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        assignedUserId:
          type: string
          format: uuid
          nullable: true
        assignedRole:
          type: string
          nullable: true
        assignedAt:
          type: string
          format: date-time
        assignmentStatus:
          $ref: '#/components/schemas/AssignmentStatus'
    NotificationPreference:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        notificationType:
          $ref: '#/components/schemas/NotificationType'
        enabledFlag:
          type: boolean
        locale:
          type: string
        quietHoursStart:
          type: string
          nullable: true
        quietHoursEnd:
          type: string
          nullable: true
    NotificationTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
          nullable: true
        scopeType:
          $ref: '#/components/schemas/TemplateScopeType'
        notificationType:
          $ref: '#/components/schemas/NotificationType'
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        language:
          type: string
        subjectTemplate:
          type: string
          nullable: true
        bodyTemplate:
          type: string
        activeFlag:
          type: boolean
        version:
          type: integer
    NotificationDelivery:
      type: object
      properties:
        id:
          type: string
          format: uuid
        notificationEventId:
          type: string
          format: uuid
        inboxItemId:
          type: string
          format: uuid
          nullable: true
        recipientUserId:
          type: string
          format: uuid
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        templateId:
          type: string
          format: uuid
          nullable: true
        deliveryStatus:
          $ref: '#/components/schemas/DeliveryStatus'
        triggeredAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
          nullable: true
        providerMessageId:
          type: string
          nullable: true
        failureReason:
          type: string
          nullable: true
    DeliverySuppression:
      type: object
      properties:
        id:
          type: string
          format: uuid
        notificationEventId:
          type: string
          format: uuid
        recipientUserId:
          type: string
          format: uuid
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        suppressionReason:
          $ref: '#/components/schemas/SuppressionReason'
        suppressedAt:
          type: string
          format: date-time
        deliveryId:
          type: string
          format: uuid
          nullable: true
    TransparentBoolean:
      type: object
      properties:
        value:
          type: boolean
        formula:
          type: string
        inputs:
          type: object
          additionalProperties: true
        effectiveAt:
          type: string
    InboxItemDetail:
      allOf:
        - $ref: '#/components/schemas/InboxItem'
        - type: object
          properties:
            overdue:
              $ref: '#/components/schemas/TransparentBoolean'
            assignments:
              type: array
              items:
                $ref: '#/components/schemas/InboxItemAssignment'
            deliveries:
              type: array
              items:
                $ref: '#/components/schemas/NotificationDelivery'
    CreateNotificationEventRequest:
      type: object
      required: [event, inboxItem]
      properties:
        event:
          type: object
          required: [eventType, sourceType, sourceId, triggeredAt, payload]
          properties:
            eventType:
              $ref: '#/components/schemas/NotificationType'
            sourceType:
              $ref: '#/components/schemas/SourceType'
            sourceId:
              type: string
              format: uuid
            correlationId:
              type: string
            triggeredAt:
              type: string
              format: date-time
            payload:
              type: object
              additionalProperties: true
        inboxItem:
          type: object
          required: [audienceType, sourceType, sourceId, title, summary, priority, status, createdAt]
          properties:
            audienceType:
              $ref: '#/components/schemas/AudienceType'
            audienceUserId:
              type: string
              format: uuid
            audienceRole:
              type: string
            sourceType:
              $ref: '#/components/schemas/SourceType'
            sourceId:
              type: string
              format: uuid
            title:
              type: string
            summary:
              type: string
            priority:
              $ref: '#/components/schemas/InboxPriority'
            dueAt:
              type: string
              format: date-time
            status:
              $ref: '#/components/schemas/InboxStatus'
            primaryActionLabel:
              type: string
            primaryActionUrl:
              type: string
            secondaryActionUrl:
              type: string
            createdAt:
              type: string
              format: date-time
        delivery:
          type: object
          properties:
            recipientUserId:
              type: string
              format: uuid
            channel:
              $ref: '#/components/schemas/NotificationChannel'
            triggeredAt:
              type: string
              format: date-time
            referenceLocalTime:
              type: string
            duplicateDeliveryFlag:
              type: boolean
    NotificationEventCreationResult:
      type: object
      properties:
        event:
          $ref: '#/components/schemas/NotificationEvent'
        inboxItem:
          $ref: '#/components/schemas/InboxItem'
        delivery:
          $ref: '#/components/schemas/NotificationDelivery'
          nullable: true
        suppression:
          $ref: '#/components/schemas/DeliverySuppression'
          nullable: true
    UpdateInboxItemRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/InboxStatus'
        readAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
    CreateInboxItemAssignmentRequest:
      type: object
      required: [assignedAt, assignmentStatus]
      properties:
        assignedUserId:
          type: string
          format: uuid
        assignedRole:
          type: string
        assignedAt:
          type: string
          format: date-time
        assignmentStatus:
          $ref: '#/components/schemas/AssignmentStatus'
    CreateNotificationPreferenceRequest:
      type: object
      required: [userId, channel, notificationType, locale]
      properties:
        userId:
          type: string
          format: uuid
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        notificationType:
          $ref: '#/components/schemas/NotificationType'
        enabledFlag:
          type: boolean
          default: true
        locale:
          type: string
        quietHoursStart:
          type: string
        quietHoursEnd:
          type: string
    UpdateNotificationPreferenceRequest:
      type: object
      properties:
        enabledFlag:
          type: boolean
        locale:
          type: string
        quietHoursStart:
          type: string
        quietHoursEnd:
          type: string
    CreateNotificationTemplateRequest:
      type: object
      required: [scopeType, notificationType, channel, language, bodyTemplate, version]
      properties:
        tenantId:
          type: string
          format: uuid
        scopeType:
          $ref: '#/components/schemas/TemplateScopeType'
        notificationType:
          $ref: '#/components/schemas/NotificationType'
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        language:
          type: string
        subjectTemplate:
          type: string
        bodyTemplate:
          type: string
        activeFlag:
          type: boolean
          default: true
        version:
          type: integer
    CreateNotificationDeliveryRequest:
      type: object
      required: [notificationEventId, recipientUserId, channel, triggeredAt]
      properties:
        notificationEventId:
          type: string
          format: uuid
        inboxItemId:
          type: string
          format: uuid
        recipientUserId:
          type: string
          format: uuid
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        templateId:
          type: string
          format: uuid
        triggeredAt:
          type: string
          format: date-time
    UpdateNotificationDeliveryRequest:
      type: object
      properties:
        deliveryStatus:
          $ref: '#/components/schemas/DeliveryStatus'
        sentAt:
          type: string
          format: date-time
        providerMessageId:
          type: string
        failureReason:
          type: string
